<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173e37"><title>Carrot Adventure</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 15%,#326e58,#122c30 78%);font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;touch-action:none}.app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 8px max(8px,env(safe-area-inset-bottom))}.top{width:min(100%,850px);display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;letter-spacing:.7px;font-size:clamp(15px,3vw,24px);text-shadow:0 3px 6px #0005}.brand span{color:#ffb54e}.pill{background:#ffffff20;border:1px solid #ffffff35;border-radius:22px;padding:7px 11px;font-weight:700;font-size:13px;white-space:nowrap}.scene{width:min(100%,900px);flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}.bottom{width:min(100%,850px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:2px}.msg{max-width:46%;font-size:clamp(11px,2.4vw,15px);color:#f1e9ca;line-height:1.3}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,45px);gap:4px}.pad button{border:1px solid #ffffff55;background:linear-gradient(#ffffff40,#ffffff1c);color:#fff;border-radius:13px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #061b2090;touch-action:manipulation}.pad button:active{transform:translateY(2px);background:#ffb54e80}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.restart{border:1px solid #ffffff44;background:#ffffff1c;border-radius:13px;color:#fff;padding:12px;font-size:18px;cursor:pointer}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#082420ad;border-radius:15px}.overlay.show{display:flex}.panel{text-align:center;background:linear-gradient(140deg,#3d8268,#174f4a);padding:26px;border-radius:24px;box-shadow:0 16px 45px #0008;border:2px solid #a6dbab;max-width:90%}.panel h2{margin:0 0 8px;font-size:27px}.panel p{line-height:1.4}.panel button{border:0;border-radius:14px;background:#ffc65c;color:#55300c;font-size:18px;font-weight:800;padding:12px 24px}.hint{font-size:11px;color:#c8e4da;text-align:center}@media(max-height:470px){.app{padding:4px}.pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,35px)}.bottom{gap:4px}.restart{padding:8px}.pill{padding:5px 8px}.brand{font-size:15px}}
</style></head><body><div class="app"><header class="top"><div class="brand">🐰 CARROT <span>ADVENTURE</span></div><div class="pill" id="levelLabel">Уровень 1/5</div><div class="pill" id="carrotLabel">🥕 0/0</div></header><main class="scene"><canvas id="game" aria-label="Изометрическая игра про кролика"></canvas><div id="overlay" class="overlay"><div class="panel"><h2 id="overlayTitle">Победа!</h2><p id="overlayText"></p><button id="nextBtn">Следующий уровень →</button></div></div></main><footer class="bottom"><div class="msg"><div id="tip">Собери всю морковку и иди к выходу.</div><div class="hint">Клавиши ← ↑ ↓ → или экранные кнопки</div></div><button class="restart" id="restart" title="Перезапустить">↻</button><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div></footer></div><script>
'use strict';
// # floor, X wall, C carrot, P start, E exit, S spike, B switch, D door
const levels=[
 {name:'Морковная поляна',tip:'Собери 3 морковки и доберись до выхода.',map:['#########','#P..C...#','#.......#','#..C....#','#.......#','#....C.E#','#########']},
 {name:'Каменные тропинки',tip:'Обходи камни. Собери все морковки.',map:['#########','#P..#..C#','#.#.#.#.#','#.#...#.#','#.###...#','#C....CE#','#########']},
 {name:'Волшебная кнопка',tip:'Встань на жёлтую кнопку B — дверь D откроется.',map:['#########','#P...#..#','#.##.#C.#','#B...D..#','#.##.#..#','#C...#CE#','#########']},
 {name:'Опасный сад',tip:'Шипы S опасны: при касании уровень начнётся заново.',map:['#########','#P..S..C#','#.##.##.#','#C...S..#','#.##.##.#','#..S.C.E#','#########']},
 {name:'Большое приключение',tip:'Собери морковь, нажми кнопку, обойди шипы и выйди.',map:['##########','#P..#...C#','#.#.#.##.#','#C.BD....#','#.###.S#.#','#...C....#','#.S..##CE#','##########']}
];
const cv=document.getElementById('game'),ctx=cv.getContext('2d');let level=0,board=[],player={x:0,y:0},carrots=0,total=0,gate=false,won=false,t=0;const $=id=>document.getElementById(id);let W=900,H=600,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);
function load(i){level=i;board=levels[i].map.map(row=>row.split(''));carrots=0;total=0;gate=false;won=false;for(let y=0;y<board.length;y++)for(let x=0;x<board[y].length;x++){if(board[y][x]==='P'){player={x,y};board[y][x]='.'}if(board[y][x]==='C')total++} $('levelLabel').textContent=`Уровень ${i+1}/${levels.length}`;$('tip').textContent=levels[i].tip;$('overlay').classList.remove('show');update()}
function update(){$('carrotLabel').textContent=`🥕 ${carrots}/${total}`}
function move(dx,dy){if(won)return;let x=player.x+dx,y=player.y+dy;if(!board[y]||!board[y][x])return;let c=board[y][x];if(c==='#'||(c==='D'&&!gate))return;if(c==='S'){load(level);$('tip').textContent='🌵 Ой! Попробуй ещё раз.';return}player={x,y};if(c==='C'){board[y][x]='.';carrots++;update()}if(c==='B'){gate=true;$('tip').textContent='🔓 Дверь открыта!'}if(c==='E'){if(carrots===total){won=true;$('overlayTitle').textContent=level===levels.length-1?'🏆 Все уровни пройдены!':'🎉 Уровень пройден!';$('overlayText').textContent=level===levels.length-1?'Кролик собрал всю морковку!':'Отлично! Впереди новое приключение.';$('nextBtn').textContent=level===levels.length-1?'Играть сначала ↻':'Следующий уровень →';$('overlay').classList.add('show')}else{$('tip').textContent=`Сначала собери морковку: осталось ${total-carrots}.`}}}
$('nextBtn').onclick=()=>load((level+1)%levels.length);$('restart').onclick=()=>load(level);
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();const [dx,dy]=dirs[b.dataset.dir];move(dx,dy)})});window.addEventListener('keydown',e=>{let key={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(key){e.preventDefault();move(...dirs[key])}});
let touch=null;cv.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});cv.addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.hypot(dx,dy)>25){if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))}touch=null},{passive:true});
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,color,width=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function draw(){requestAnimationFrame(draw);t+=0.016;ctx.clearRect(0,0,W,H);let rows=board.length,cols=board[0].length;let tile=Math.min((W-22)/(cols+rows)*1.05,(H-38)/(cols+rows)*1.75,61);tile=Math.max(tile,12);let sx=tile,sy=tile*.49;let ox=W/2-(cols-rows)*sx/2,oy=H/2-(cols+rows-2)*sy/2+tile*.28;
const p=(x,y,z=0)=>[ox+(x-y)*sx,oy+(x+y)*sy-z];let background=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.65);background.addColorStop(0,'#458c6a');background.addColorStop(1,'#1d4b47');ctx.fillStyle=background;ctx.fillRect(0,0,W,H);
let tiles=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)tiles.push({x,y,c:board[y][x]});tiles.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(let o of tiles){let {x,y,c}=o;let [cx,cy]=p(x,y);let floor=c!=='#';let grass=(x*17+y*31)%4;let top=floor?['#85bc5e','#91c76b','#7eb65a','#8fc167'][grass]:'#a7a8a0';let depth=tile*.20;poly([[cx,cy-sy],[cx+sx,cy],[cx,cy+sy],[cx-sx,cy]],top,'#ffffff16');poly([[cx-sx,cy],[cx,cy+sy],[cx,cy+sy+depth],[cx-sx,cy+depth]],floor?'#477d43':'#696b64');poly([[cx,cy+sy],[cx+sx,cy],[cx+sx,cy+depth],[cx,cy+sy+depth]],floor?'#5c9850':'#77796e');
if(c==='#'){let h=tile*.6;poly([[cx,cy-sy-h],[cx+sx,cy-h],[cx,cy+sy-h],[cx-sx,cy-h]],'#c7c4b7','#e7e5d8');poly([[cx-sx,cy-h],[cx,cy+sy-h],[cx,cy+sy],[cx-sx,cy]],'#8d9188');poly([[cx,cy+sy-h],[cx+sx,cy-h],[cx+sx,cy],[cx,cy+sy]],'#777d72');continue}
if(c==='C'){ellipse(cx,cy+sy*.12,sx*.27,sy*.20,'#00000030');ctx.save();ctx.translate(cx,cy-tile*.21);ctx.rotate(.2);ellipse(0,0,sx*.16,tile*.26,'#f48a24');ellipse(-sx*.03,-tile*.08,sx*.07,tile*.15,'#ffc260');line(0,-tile*.22,-sx*.08,-tile*.41,'#347e36',3);line(0,-tile*.22,sx*.12,-tile*.39,'#2e8a35',3);ctx.restore()}
if(c==='B'){poly([[cx,cy-sy*.55],[cx+sx*.55,cy],[cx,cy+sy*.55],[cx-sx*.55,cy]],gate?'#7bf4d2':'#ffd15d','#fff7');ellipse(cx,cy,4,3,gate?'#fff':'#b47b17')}
if(c==='D'&&!gate){let h=tile*.63;poly([[cx-sx*.45,cy-h],[cx,cy+sy*.45-h],[cx,cy+sy*.45],[cx-sx*.45,cy]],'#b67a4d');poly([[cx,cy+sy*.45-h],[cx+sx*.45,cy-h],[cx+sx*.45,cy],[cx,cy+sy*.45]],'#88552f');line(cx-sx*.25,cy-h*.75,cx+sx*.1,cy-h*.65,'#e8bf6a',3)}
if(c==='S'){for(let k=-1;k<=1;k++){let px=cx+k*sx*.30,py=cy+Math.abs(k)*sy*.15;poly([[px-sx*.17,py+sy*.19],[px,py-tile*.36],[px+sx*.17,py+sy*.19]],'#f0e2bd','#826a57')}}
if(c==='E'){ellipse(cx,cy, sx*.46,sy*.50,'#2e6e86');ellipse(cx,cy-sy*.12,sx*.30,sy*.30,carrots===total?'#ffe879':'#9ad1c8');ellipse(cx,cy-sy*.15,sx*.14,sy*.15,'#fff7')}
if((x*7+y*13)%7===0&&c==='.') {ellipse(cx+sx*.3,cy+sy*.16,2,2,'#fff5c8');ellipse(cx+sx*.34,cy+sy*.08,2,2,'#ffb6c1')}
if(player.x===x&&player.y===y){let bob=Math.sin(t*3)*tile*.025;ellipse(cx,cy+sy*.2,sx*.30,sy*.24,'#173d2a65');let by=cy-tile*.35+bob;ellipse(cx,by,sx*.29,tile*.27,'#f5f1df');ellipse(cx,by-tile*.22,sx*.28,tile*.23,'#fffaf0');ellipse(cx-sx*.15,by-tile*.60,sx*.10,tile*.28,'#f5f0e8');ellipse(cx+sx*.15,by-tile*.60,sx*.10,tile*.28,'#f5f0e8');ellipse(cx-sx*.15,by-tile*.61,sx*.048,tile*.20,'#e8a4ad');ellipse(cx+sx*.15,by-tile*.61,sx*.048,tile*.20,'#e8a4ad');ellipse(cx-sx*.12,by-tile*.24,2.5,3,'#28382c');ellipse(cx+sx*.12,by-tile*.24,2.5,3,'#28382c');ellipse(cx,by-tile*.14,3,2,'#e28f9a');ellipse(cx+sx*.25,by+tile*.06,sx*.13,tile*.12,'#fff');}}
}resize();load(0);requestAnimationFrame(draw);
</script></body></html>
