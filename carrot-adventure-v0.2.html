</style></head><body><div class="app"><header><a class="brand" href="#">CARROT <b>ADVENTURE</b><small>THE ENCHANTED GARDENS · v0.3.0</small></a><div class="level"><small id="chapter"></small><strong id="name"></strong></div><div class="counter" id="count"></div><button id="levelsBtn" aria-label="Выбор уровня">☷</button><button id="pause" aria-label="Пауза">Ⅱ</button></header><main><canvas id="game" aria-label="Игровое поле. Управляй кроликом стрелками или свайпами."></canvas><div class="vignette"></div><div id="overlay" hidden><section><small id="eyebrow"></small><h1 id="title"></h1><p id="description"></p><button class="primary" id="next"></button><button id="replay" hidden>Повторить уровень</button></section></div></main><footer><div class="info"><span class="tag">СКАЗОЧНОЕ ПУТЕШЕСТВИЕ</span><p id="tip" role="status"></p><small>Стрелка или свайп = шаг в ту же сторону</small></div><div class="tools"><button id="restart" aria-label="Перезапустить уровень">↻</button><button id="sound" aria-label="Включить или выключить звук"></button></div><div class="pad"><button data-dir="up" aria-label="Вверх">↑</button><button data-dir="left" aria-label="Влево">←</button><span>🐾</span><button data-dir="right" aria-label="Вправо">→</button><button data-dir="down" aria-label="Вниз">↓</button></div></footer><div id="levelMenu" class="level-menu" hidden role="dialog" aria-modal="true" aria-labelledby="menuTitle"><section><small>ТВОЁ ПУТЕШЕСТВИЕ</small><h1 id="menuTitle">Пять волшебных садов</h1><p>Открывай сады по порядку. При выборе другого сада он начнётся заново.</p><div id="levelCards"></div><button id="closeLevels" class="primary">Вернуться в игру</button></section></div><div class="rotate">Поверни планшет горизонтально для более крупного игрового поля ↻</div></div><script>"use strict";(()=>{
// levels.js
// # rock, ~ water, = bridge, C carrot, P spawn, E exit,
// A/B latched pressure plates, a/b matching gates, S spikes, K checkpoint.
const levels = [
 {name:'Морковная поляна',tip:'Собери 5 морковок. Вверх — значит вверх. Собери морковь и найди выход.',map:[
 '#########','#P.C...C#','#..#....#','#C...#..#','#..C..CE#','#########']},
 {name:'Каменный лабиринт',tip:'Исследуй боковые дорожки — морковка есть и в тупиках.',map:[
 '###########','#P.C#C...C#','#.#.#.##..#','#C#...C#C.#','#.###..#..#','#C....C..E#','###########']},
 {name:'Волшебные ворота',tip:'Наступи на золотую плиту: ворота останутся открытыми.',map:[
 '###########','#P.C.#C..C#','#.##.#.#..#','#A.C.a.C..#','#.##.#.#C.#','#C...#..E.#','###########']},
 {name:'Опасный сад',tip:'Флажок — контрольная точка. Шипы возвращают к ней, сохраняя морковь.',map:[
 '###########','#P.C..SC.C#','#.##..##..#','#CK..C..C.#','#.~~=~~.S.#','#C..C...CE#','###########']},
 {name:'Тайна морковного замка',tip:'Две плиты открывают два прохода. Финальные ворота ждут 12 морковок.',map:[
 '#############','#P.C#C.C#C.C#','#.#.#.#.#.#.#','#AC.a.C.b.CE#','#.S.#S..#S..#','#C.K#C.B#C..#','#~~~~~=~~~~~#','#.....C.....#','#############']}
];
const counts=[5,8,7,9,12];

// collision.js
const directions={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function cell(level,x,y){return level.map[y]?.[x] ?? '#';}
function canEnter(level,x,y,gates){const c=cell(level,x,y);return c!=='#'&&c!=='~'&&(c!=='a'||(gates&1))&&(c!=='b'||(gates&2));}

// save.js
const KEY='carrot-adventure-v02';
function readSave(){try {const s=JSON.parse(localStorage.getItem(KEY)); return s?.version===2?s:null;}catch{return null;}}
function writeSave(s){try{localStorage.setItem(KEY,JSON.stringify({version:2,...s}));return true;}catch{return false;}}

// player.js
function visualPosition(g,now){const a=g.animation;if(!a)return {...g.state.player,hop:0};const t=Math.min(1,(now-a.start)/180),e=t*t*(3-2*t);return {x:a.from.x+(a.to.x-a.from.x)*e,y:a.from.y+(a.to.y-a.from.y)*e,hop:Math.sin(t*Math.PI)};}

// view.js
// The screen axes match the grid axes: x increases right, y increases down.
function boardView(width,height,cols,rows){
 const size=Math.max(1,Math.min((width-24)/cols,(height-24)/rows,110));
 const left=(width-cols*size)/2,top=(height-rows*size)/2;
 return {size,left,top,project:(x,y)=>[left+(x+.5)*size,top+(y+.5)*size]};
}

// game.js


function initial(index=0){const l=levels[index];let player;const carrots=[];l.map.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='P')player={x,y};if(c==='C')carrots.push(`${x},${y}`);}));return {index,player,checkpoint:{...player},remaining:carrots,gates:0,moves:0,mistakes:0,won:false};}
function step(state,dir){if(state.won||!directions[dir])return {state,event:'blocked'};const l=levels[state.index],[dx,dy]=directions[dir],x=state.player.x+dx,y=state.player.y+dy;if(!canEnter(l,x,y,state.gates))return {state,event:'blocked'};
const s={...state,player:{x,y},remaining:[...state.remaining],moves:state.moves+1};let event='step';const c=cell(l,x,y);
if(c==='S'){s.player={...s.checkpoint};s.mistakes++;return {state:s,event:'trap'};}
if(s.remaining.includes(`${x},${y}`)){s.remaining=s.remaining.filter(k=>k!==`${x},${y}`);event='carrot';}
if(c==='A'||c==='B'){s.gates|=c==='A'?1:2;event='gate';}
if(c==='K'){s.checkpoint={x,y};event='checkpoint';}
if(c==='E'){s.won=!s.remaining.length;event=s.won?'win':'locked';}return {state:s,event};}
function validSave(s){try {if(!Number.isInteger(s.index)||s.index<0||s.index>=levels.length)return false;const clean=initial(s.index),l=levels[s.index];return Number.isInteger(s.gates)&&s.gates>=0&&s.gates<=3&&Array.isArray(s.remaining)&&new Set(s.remaining).size===s.remaining.length&&s.remaining.every(k=>clean.remaining.includes(k))&&[s.player,s.checkpoint].every(p=>p&&Number.isInteger(p.x)&&Number.isInteger(p.y)&&canEnter(l,p.x,p.y,s.gates)&&cell(l,p.x,p.y)!=='S')&&['moves','mistakes'].every(k=>Number.isInteger(s[k])&&s[k]>=0)&&typeof s.won==='boolean'&&(!s.won||(!s.remaining.length&&cell(l,s.player.x,s.player.y)==='E'));}catch{return false;}}
class Game{constructor(saved,onChange){this.state=validSave(saved)?saved:initial();this.animation=null;this.onChange=onChange;this.paused=false;}move(dir,now=performance.now()){if(this.paused||(this.animation&&now-this.animation.start<185))return;const old=this.state;const r=step(old,dir);if(r.state===old)return;this.state=r.state;this.animation={from:old.player,to:r.state.player,start:now,event:r.event};if(r.event==='trap')this.animation.from={...r.state.player};this.onChange(r.event);}load(i){this.state=initial(i);this.animation=null;this.paused=false;this.onChange('load');}}

// audio.js
class Audio{constructor(enabled=true){this.enabled=enabled;this.ctx=null;this.timer=null;this.note=0;}unlock(){if(!this.enabled)return;try{this.ctx??=new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume();if(!this.timer)this.timer=setInterval(()=>{if(document.hidden||this.paused)return;this.tone([261.63,329.63,392,329.63,293.66,349.23,440,349.23][this.note++%8],.35,.018);},550);}catch{}}tone(f,d=.1,v=.05){if(!this.enabled||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(this.ctx.destination);o.start();o.stop(t+d);}play(event){this.tone(({carrot:880,gate:523,checkpoint:660,trap:130,win:1046})[event]||220,.13,event==='step'?.012:.06);}toggle(){this.enabled=!this.enabled;if(!this.enabled){clearInterval(this.timer);this.timer=null;}else this.unlock();return this.enabled;}}

// input.js
function bindInput(canvas,move,unlock,pause){let held=null,timer;function stop(){held=null;clearInterval(timer);timer=null;}function start(d){stop();unlock();held=d;move(d);timer=setInterval(()=>move(d),210);}document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);start(b.dataset.dir);});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,stop));});
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(!e.repeat)start(keys[e.key]);}if(e.key==='Escape'){stop();pause();}});window.addEventListener('keyup',e=>{if(keys[e.key]===held)stop();});window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{stop();if(document.hidden)pause(true);});let touch;canvas.addEventListener('pointerdown',e=>{unlock();touch={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(!touch||touch.id!==e.pointerId)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)>24)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');});canvas.addEventListener('pointercancel',()=>touch=null);return stop;}

// renderer.js



class Renderer{
 constructor(canvas,game){this.cv=canvas;this.c=canvas.getContext('2d');this.game=game;this.last=0;this.time=0;this.resize=()=>{const r=canvas.getBoundingClientRect();this.w=r.width;this.h=r.height;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);this.c.setTransform(d,0,0,d,0,0);};new ResizeObserver(this.resize).observe(canvas);this.resize();}
 poly(ps,fill,stroke){const c=this.c;c.beginPath();ps.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=.8;c.stroke();}}
 oval(x,y,a,b,color){const c=this.c;c.beginPath();c.ellipse(x,y,Math.max(.01,a),Math.max(.01,b),0,0,Math.PI*2);c.fillStyle=color;c.fill();}
 line(x,y,u,v,col,width=1){const c=this.c;c.beginPath();c.moveTo(x,y);c.lineTo(u,v);c.strokeStyle=col;c.lineWidth=width;c.lineCap='round';c.stroke();}
 grad(x,y,r,a,b){const g=this.c.createRadialGradient(x-r*.3,y-r*.4,r*.05,x,y,r);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
 stone(x,y,z,seed){this.oval(x+z*.15,y+z*.1,z*.65,z*.23,'#153a3655');this.poly([[x-z*.6,y-z*.15],[x-z*.38,y-z*.85],[x+z*.25,y-z],[x+z*.62,y-z*.5],[x+z*.46,y+z*.05],[x-z*.22,y+z*.18]],'#6b8278');this.poly([[x-z*.6,y-z*.15],[x-z*.38,y-z*.85],[x+z*.25,y-z],[x+z*.1,y-z*.38]],'#b3c1a0');this.poly([[x+z*.1,y-z*.38],[x+z*.25,y-z],[x+z*.62,y-z*.5],[x+z*.46,y+z*.05]],'#879b89');this.oval(x-z*.22,y-z*.72,z*.21,z*.1,'#9db45e');this.line(x+z*.15,y-z*.2,x+z*.31,y-z*.4,'#d7d4b355',1);}
 tree(x,y,z,seed){const c=this.c;this.oval(x+z*.5,y+z*.15,z*1.15,z*.35,'#0a30314a');this.line(x,y,x-z*.12,y-z*1.4,'#705b3d',z*.22);this.line(x,y-z*.65,x+z*.4,y-z*1.25,'#877445',z*.12);for(let j=0;j<5;j++){let u=x+Math.sin(j*2.4+seed)*z*.48,v=y-z*1.7+Math.cos(j*2.4)*z*.4;this.oval(u,v,z*.72,z*.66,this.grad(u,v,z*.8,j%2?'#bbd86d':'#94c768','#2e7651'));}this.oval(x-z*.2,y-z*2.12,z*.28,z*.1,'#dfed9f55');}
